# Local Postgres for `node --run dev`; matches the HYPERDRIVE localConnectionString in wrangler.toml
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodepanel
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d nodepanel]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
