name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default, jobs opt into more below
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Add NPM Authentication
        run: (echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" && cat ./.npmrc) > ./.npmrc2 && mv ./.npmrc2 ./.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci
      - run: node --run lint
      - run: node --run check-types
      - run: node --run test
